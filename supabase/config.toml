project_id = "rlwygbvuukrcxkytzbxf"

# Signup phone verification runs before the user has an account/session, so it
# must be reachable without a user JWT. It enforces its own abuse controls
# (rate limit, TTL, attempt cap) and only ever writes the service-role-locked
# public.phone_otps table.
[functions.verify-phone]
verify_jwt = false
# Stripe posts here with no Supabase session token — auth is the HMAC signature
# check against PAYMENTS_*_WEBHOOK_SECRET, performed before any payload is read.
[functions.stripe-webhook]
verify_jwt = false
# Runs immediately after signUp() while email confirmation is still pending, so
# there is no user JWT yet. It authorizes itself by re-checking the auth user's
# age, farmer role metadata, and a recently verified phone_otps row.
[functions.farmer-onboard]
verify_jwt = false
