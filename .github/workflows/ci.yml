name: CI

# Quality gate: lint, type-check, and unit tests.
# Runs on every pull request and on pushes to main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun run test

      - name: Social card check (OG / Twitter)
        # Fails the build when og:image / twitter:image is missing, unreachable,
        # not absolute https, or not 1200x630 on the key marketing routes.
        env:
          OG_CHECK_BASE_URL: ${{ vars.OG_CHECK_BASE_URL || 'https://app.digifamar.com' }}
        run: bun run check:og
