name: Build Android App

# Builds:
#   • Debug APK    — always, for sideloading + QA
#   • Release AAB  — only when ANDROID_KEYSTORE_BASE64 secret is set
#
# To produce a Play-Store-ready signed .aab, add these 4 repo secrets:
#   ANDROID_KEYSTORE_BASE64   base64-encoded contents of your release.keystore
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias inside the keystore (e.g. "digifamar")
#   ANDROID_KEY_PASSWORD      key password
#
# Generate a keystore once on your machine:
#   keytool -genkey -v -keystore release.keystore -alias digifamar \
#           -keyalg RSA -keysize 2048 -validity 10000
#   base64 -w0 release.keystore   # paste output into ANDROID_KEYSTORE_BASE64

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install

      - name: Build mobile SPA
        run: |
          set -o pipefail
          bun run build:mobile 2>&1 | tee build_mobile.log

      - name: Sync Capacitor (Android)
        run: |
          set -o pipefail
          npx cap sync android 2>&1 | tee cap_sync.log

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ---------- Debug APK (always) ----------
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle_debug.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: digifamar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ---------- Signed release .aab (only if keystore secret exists) ----------
      - name: Check for keystore secret
        id: keystore_check
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANDROID_KEYSTORE_BASE64 not set — skipping signed release .aab build."
          fi

      - name: Decode keystore and write keystore.properties
        if: steps.keystore_check.outputs.present == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          ls -l android/app/release.keystore
          keytool -list -keystore android/app/release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" > android/keystore_info.txt 2>&1
          cat android/keystore_info.txt
          alias_from_keystore=$(grep -m1 'PrivateKeyEntry' android/keystore_info.txt | sed 's/,.*//' | tr -d ' ')
          if [ -z "$alias_from_keystore" ]; then
            echo 'No PrivateKeyEntry found in keystore; using provided ANDROID_KEY_ALIAS'
            alias_from_keystore="$ANDROID_KEY_ALIAS"
          fi
          echo "Resolved keystore alias: $alias_from_keystore"
          cat > android/keystore.properties <<EOF
storeFile=release.keystore
storePassword=$ANDROID_KEYSTORE_PASSWORD
keyAlias=$alias_from_keystore
keyPassword=$ANDROID_KEY_PASSWORD
EOF

      - name: Build signed release AAB
        if: steps.keystore_check.outputs.present == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set +e
          ./gradlew bundleRelease --no-daemon --stacktrace 2>&1 | tee gradle_release.log
          exit_code=$?
          set -e
          if [ $exit_code -ne 0 ]; then
            grep -n -E 'FAILED|What went wrong|Execution failed|Cannot recover|Invalid keystore|password|tampered|No certificate' gradle_release.log | tail -n 30 > gradle_error.txt
          fi
          exit $exit_code

      - name: Upload release AAB
        if: steps.keystore_check.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digifamar-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Print release certificate fingerprint
        if: steps.keystore_check.outputs.present == 'true'
        working-directory: android
        run: |
          keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | grep -i 'SHA256' | tee ../fingerprint.txt

      - name: Comment AAB fingerprint on commit
        if: steps.keystore_check.outputs.present == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          fingerprint=$(cat fingerprint.txt 2>/dev/null || echo 'Fingerprint not found')
          body=$(jq -n --arg sha "$GITHUB_SHA" --arg fp "$fingerprint" '{
            body: "Signed release AAB certificate fingerprint for `\($sha)`:\n\n```\n\($fp)\n```"
          }')
          curl -sS -H "Authorization: token $GITHUB_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               -H "Content-Type: application/json" \
               -d "$body" \
               "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments"

      - name: Comment build failure log on commit
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          readTail() { tail -c 1200 "$1" 2>/dev/null || echo "($1 not found)"; }
          mobileLog=$(readTail build_mobile.log)
          capLog=$(readTail cap_sync.log)
          gradleDebugLog=$(readTail android/gradle_debug.log)
          gradleReleaseLog=$(readTail android/gradle_release.log)
          keystoreInfo=$(head -c 2000 android/keystore_info.txt 2>/dev/null || echo "(keystore_info.txt not found)")
          gradleError=$(readTail android/gradle_error.txt)
          body=$(jq -n --arg sha "$GITHUB_SHA" --arg mobile "$mobileLog" --arg cap "$capLog" --arg gd "$gradleDebugLog" --arg gr "$gradleReleaseLog" --arg ks "$keystoreInfo" --arg ge "$gradleError" '{
            body: "Build failed for `\($sha)`.\n\nMobile build log (tail):\n```\n\($mobile)\n```\n\nCapacitor sync log (tail):\n```\n\($cap)\n```\n\nGradle debug log (tail):\n```\n\($gd)\n```\n\nGradle release log (tail):\n```\n\($gr)\n```\n\nKeystore info:\n```\n\($ks)\n```\n\nGradle error grep:\n```\n\($ge)\n```"
          }')
          curl -sS -H "Authorization: token $GITHUB_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               -H "Content-Type: application/json" \
               -d "$body" \
               "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments"
