name: Build Android App

# Builds:
#   • Debug APK    — always, for sideloading + QA
#   • Release AAB  — only when ANDROID_KEYSTORE_BASE64 secret is set
#
# To produce a Play-Store-ready signed .aab, add these 4 repo secrets:
#   ANDROID_KEYSTORE_BASE64   base64-encoded contents of your release.keystore
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias inside the keystore (e.g. "digifamar")
#   ANDROID_KEY_PASSWORD      key password
#
# Generate a keystore once on your machine:
#   keytool -genkey -v -keystore release.keystore -alias digifamar \
#           -keyalg RSA -keysize 2048 -validity 10000
#   base64 -w0 release.keystore   # paste output into ANDROID_KEYSTORE_BASE64

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install

      - name: Build mobile SPA
        run: |
          set -o pipefail
          bun run build:mobile 2>&1 | tee build_mobile.log

      - name: Sync Capacitor (Android)
        run: |
          set -o pipefail
          npx cap sync android 2>&1 | tee cap_sync.log

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ---------- Debug APK (always) ----------
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle_debug.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: digifamar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ---------- Signed release .aab (only if keystore secret exists) ----------
      - name: Check for keystore secret
        id: keystore_check
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANDROID_KEYSTORE_BASE64 not set — skipping signed release .aab build."
          fi

      - name: Decode keystore and resolve key alias
        if: steps.keystore_check.outputs.present == 'true'
        id: decode_keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          ls -l android/app/release.keystore
          keytool -list -keystore android/app/release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" > android/keystore_info.txt 2>&1
          cat android/keystore_info.txt
          alias_from_keystore=$(grep -m1 'PrivateKeyEntry' android/keystore_info.txt | sed 's/,.*//' | tr -d ' ')
          if [ -z "$alias_from_keystore" ]; then
            echo 'No PrivateKeyEntry found in keystore; using provided ANDROID_KEY_ALIAS'
            alias_from_keystore="$ANDROID_KEY_ALIAS"
          fi
          echo "Resolved keystore alias: $alias_from_keystore"
          echo "key_alias=$alias_from_keystore" >> "$GITHUB_OUTPUT"

      - name: Build unsigned release APK
        if: steps.keystore_check.outputs.present == 'true'
        working-directory: android
        run: |
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle_release.log
          exit_code=$?
          set -e
          if [ $exit_code -ne 0 ]; then
            grep -n -E 'FAILED|What went wrong|Execution failed|Cannot recover|Invalid keystore|password|tampered|No certificate' gradle_release.log | tail -n 30 > gradle_error.txt
          fi
          exit $exit_code

      - name: Sign release APK with apksigner
        if: steps.keystore_check.outputs.present == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ steps.decode_keystore.outputs.key_alias }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          APK_SIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$APK_SIGNER" ]; then APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1); fi
          ZIP_ALIGN=$(find "$ANDROID_SDK_ROOT/build-tools" -name zipalign -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$ZIP_ALIGN" ]; then ZIP_ALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign -type f 2>/dev/null | sort -V | tail -1); fi
          echo "Using apksigner: $APK_SIGNER"
          echo "Using zipalign: $ZIP_ALIGN"
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=app/build/outputs/apk/release/app-release-aligned-unsigned.apk
          SIGNED=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$UNSIGNED" ]; then
            echo "Unsigned APK not found at $UNSIGNED"
            ls -R app/build/outputs/apk/release/
            exit 1
          fi
          "$ZIP_ALIGN" -p 4 "$UNSIGNED" "$ALIGNED"
          "$APK_SIGNER" sign --ks app/release.keystore --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "$SIGNED" "$ALIGNED"
          "$APK_SIGNER" verify -v "$SIGNED"

      - name: Upload release APK
        if: steps.keystore_check.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digifamar-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Print release APK certificate fingerprint
        if: steps.keystore_check.outputs.present == 'true'
        working-directory: android
        run: |
          keytool -printcert -jarfile app/build/outputs/apk/release/app-release.apk | grep -i 'SHA256' | tee ../fingerprint.txt

      - name: Comment APK fingerprint on commit
        if: steps.keystore_check.outputs.present == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          fingerprint=$(cat fingerprint.txt 2>/dev/null || echo 'Fingerprint not found')
          body=$(jq -n --arg sha "$GITHUB_SHA" --arg fp "$fingerprint" '{
            body: "Signed release APK certificate fingerprint for `\($sha)`:\n\n```\n\($fp)\n```"
          }')
          curl -sS -H "Authorization: token $GITHUB_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               -H "Content-Type: application/json" \
               -d "$body" \
               "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" || true

      - name: Build unsigned release AAB
        if: steps.keystore_check.outputs.present == 'true'
        working-directory: android
        run: |
          set +e
          ./gradlew bundleRelease --no-daemon --stacktrace 2>&1 | tee gradle_bundle.log
          exit_code=$?
          set -e
          if [ $exit_code -ne 0 ]; then
            grep -n -E 'FAILED|What went wrong|Execution failed|Cannot recover|Invalid keystore|password|tampered|No certificate' gradle_bundle.log | tail -n 30 > gradle_bundle_error.txt
          fi
          exit $exit_code

      - name: Sign release AAB with jarsigner
        if: steps.keystore_check.outputs.present == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ steps.decode_keystore.outputs.key_alias }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          AAB=app/build/outputs/bundle/release/app-release.aab
          if [ ! -f "$AAB" ]; then
            echo "AAB not found at $AAB"
            ls -R app/build/outputs/bundle/release/
            exit 1
          fi
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -tsa http://timestamp.digicert.com \
            -keystore app/release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            "$AAB" "$ANDROID_KEY_ALIAS"
          jarsigner -verify -verbose -certs "$AAB" | head -n 20

      - name: Upload release AAB
        if: steps.keystore_check.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digifamar-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Print release AAB certificate fingerprint
        if: steps.keystore_check.outputs.present == 'true'
        working-directory: android
        run: |
          keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | grep -i 'SHA256' | tee ../aab_fingerprint.txt

      - name: Comment AAB fingerprint on commit
        if: steps.keystore_check.outputs.present == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          fingerprint=$(cat aab_fingerprint.txt 2>/dev/null || echo 'Fingerprint not found')
          body=$(jq -n --arg sha "$GITHUB_SHA" --arg fp "$fingerprint" '{
            body: "Signed release AAB certificate fingerprint for `\($sha)`:\n\n```\n\($fp)\n```"
          }')
          curl -sS -H "Authorization: token $GITHUB_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               -H "Content-Type: application/json" \
               -d "$body" \
               "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" || true

      - name: Push signed AAB fingerprint to ci-logs branch
        if: steps.keystore_check.outputs.present == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -b "ci-logs/run-${GITHUB_RUN_ID}-aab-fingerprint"
          cp aab_fingerprint.txt "aab-fingerprint-${GITHUB_RUN_ID}.txt"
          git add "aab-fingerprint-${GITHUB_RUN_ID}.txt"
          git commit -m "ci: AAB fingerprint for run ${GITHUB_RUN_ID}"
          git push origin "ci-logs/run-${GITHUB_RUN_ID}-aab-fingerprint"

      - name: Push signed APK fingerprint to ci-logs branch
        if: steps.keystore_check.outputs.present == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -b "ci-logs/run-${GITHUB_RUN_ID}-apk-fingerprint"
          cp fingerprint.txt "apk-fingerprint-${GITHUB_RUN_ID}.txt"
          git add "apk-fingerprint-${GITHUB_RUN_ID}.txt"
          git commit -m "ci: APK fingerprint for run ${GITHUB_RUN_ID}"
          git push origin "ci-logs/run-${GITHUB_RUN_ID}-apk-fingerprint"

      - name: Push build failure logs to ci-logs branch
        if: failure()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          readTail() { tail -c 5000 "$1" 2>/dev/null || echo "($1 not found)"; }
          {
            echo "=== SHA ==="
            echo "$GITHUB_SHA"
            echo "=== RUN ID ==="
            echo "$GITHUB_RUN_ID"
            echo "=== Mobile build log ==="
            readTail build_mobile.log
            echo "=== Capacitor sync log ==="
            readTail cap_sync.log
            echo "=== Gradle debug log ==="
            readTail android/gradle_debug.log
            echo "=== Gradle release log ==="
            readTail android/gradle_release.log
            echo "=== Keystore info ==="
            head -c 5000 android/keystore_info.txt 2>/dev/null || echo "(keystore_info.txt not found)"
            echo "=== Gradle error grep ==="
            readTail android/gradle_error.txt
          } > "build-failure-${GITHUB_RUN_ID}.txt"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -b "ci-logs/run-${GITHUB_RUN_ID}-failure"
          git add "build-failure-${GITHUB_RUN_ID}.txt"
          git commit -m "ci: build failure logs for run ${GITHUB_RUN_ID}"
          git push origin "ci-logs/run-${GITHUB_RUN_ID}-failure"
