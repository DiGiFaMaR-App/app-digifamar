name: Build Android App

# Builds:
#   • Debug APK    — always, for sideloading + QA
#   • Release APK  — only when ANDROID_KEYSTORE_BASE64 secret is set
#   • Release AAB  — only when ANDROID_KEYSTORE_BASE64 secret is set
#
# Every successful run publishes a downloadable GitHub Release containing the
# APK (and AAB when signed), so you never have to dig through Actions
# artifacts to install a build.
#
# Versioning is automatic:
#   versionName = "version" field in package.json  (e.g. 1.0.1)
#   versionCode = VERSION_CODE_OFFSET + GITHUB_RUN_NUMBER  (always increasing)
# Bump the marketing version by editing package.json; the build number takes
# care of itself. You can also override both on a manual run.
#
# To produce Play-Store-ready signed artifacts, add these 4 repo secrets:
#   ANDROID_KEYSTORE_BASE64   base64-encoded contents of your release.keystore
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias inside the keystore (e.g. "digifamar")
#   ANDROID_KEY_PASSWORD      key password
#
# Generate a keystore once on your machine:
#   keytool -genkey -v -keystore release.keystore -alias digifamar \
#           -keyalg RSA -keysize 2048 -validity 10000
#   base64 -w0 release.keystore   # paste output into ANDROID_KEYSTORE_BASE64

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Override versionName (e.g. 1.2.0). Leave blank to use package.json."
        required: false
        default: ""
      version_code:
        description: "Override versionCode (integer). Leave blank for auto."
        required: false
        default: ""

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bumping this offset shifts every future build number upward at once.
  VERSION_CODE_OFFSET: 100

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install

      # ---------- Mobile build-time env ----------
      # Writes an untracked .env consumed by vite.config.mobile.ts (loadEnv).
      # Never committed: .env is gitignored and no step commits anything.
      - name: Write mobile env file
        run: |
          cat > .env <<EOF
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID=${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_PAYMENTS_CLIENT_TOKEN=${{ secrets.VITE_PAYMENTS_CLIENT_TOKEN }}
          VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY=${{ secrets.VITE_MAPS_KEY }}
          EOF



      # ---------- Version resolution ----------
      - name: Resolve app version
        id: version
        env:
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code }}
        run: |
          set -e
          pkg_version=$(node -p "require('./package.json').version || '1.0.0'")
          version_name="${INPUT_VERSION_NAME:-$pkg_version}"
          if [ -n "$INPUT_VERSION_CODE" ]; then
            version_code="$INPUT_VERSION_CODE"
          else
            version_code=$(( VERSION_CODE_OFFSET + GITHUB_RUN_NUMBER ))
          fi
          echo "versionName=$version_name"
          echo "versionCode=$version_code"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=v${version_name}+${version_code}" >> "$GITHUB_OUTPUT"

      - name: Apply version to Android build.gradle
        run: |
          set -e
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode ${{ steps.version.outputs.version_code }}/" android/app/build.gradle
          sed -i -E "s/versionName[[:space:]]+\"[^\"]*\"/versionName \"${{ steps.version.outputs.version_name }}\"/" android/app/build.gradle
          grep -nE 'versionCode|versionName' android/app/build.gradle

      # ---------- Web build + Capacitor sync ----------
      # CI-only: source maps are generated here (never in the default
      # `bun run build:mobile`), uploaded to PostHog, then deleted before
      # `cap sync` so no .map file ever ships inside the APK/AAB.
      - name: Build mobile SPA
        run: |
          set -o pipefail
          bun run build:mobile --sourcemap 2>&1 | tee build_mobile.log

      - name: PostHog sourcemap inject
        continue-on-error: true
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_CLI_ENV_ID: "547025"
        run: npx --yes @posthog/cli@latest --host https://us.posthog.com sourcemap inject --directory dist/client/assets

      - name: PostHog sourcemap upload
        continue-on-error: true
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_CLI_ENV_ID: "547025"
        run: |
          npx --yes @posthog/cli@latest --host https://us.posthog.com sourcemap upload \
            --directory dist/client/assets \
            --delete-after \
            --release-name digifamar-android \
            --release-version "${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}" \
            --build "${{ steps.version.outputs.version_code }}"

      # Safety net: if either PostHog step failed, maps may still be on disk.
      - name: Strip source maps before packaging
        if: always()
        run: |
          find dist/client -name '*.map' -type f -print -delete || true

      - name: Sync Capacitor (Android)
        run: |
          set -o pipefail
          npx cap sync android 2>&1 | tee cap_sync.log


      # ---------- Android toolchain ----------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk 36 is declared in android/variables.gradle. Installing the
      # platform + build-tools explicitly avoids flaky on-demand SDK downloads
      # and guarantees apksigner/zipalign exist for the signing steps.
      - name: Install required Android SDK packages
        run: |
          set -e
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "ANDROID_BUILD_TOOLS=$ANDROID_SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ---------- Debug APK (always) ----------
      - name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle_debug.log

      - name: Stage debug APK
        run: |
          set -e
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/digifamar-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}-debug.apk"
          ls -l artifacts

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: digifamar-debug-apk
          path: artifacts/*-debug.apk
          if-no-files-found: error

      # ---------- Signed release build (only if keystore secret exists) ----------
      - name: Check for keystore secret
        id: keystore_check
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANDROID_KEYSTORE_BASE64 not set — publishing the debug APK only."
          fi

      - name: Decode keystore and resolve key alias
        if: steps.keystore_check.outputs.present == 'true'
        id: decode_keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          ls -l android/app/release.keystore
          keytool -list -keystore android/app/release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" > android/keystore_info.txt 2>&1
          cat android/keystore_info.txt
          alias_from_keystore=$(grep -m1 'PrivateKeyEntry' android/keystore_info.txt | sed 's/,.*//' | tr -d ' ')
          if [ -z "$alias_from_keystore" ]; then
            echo 'No PrivateKeyEntry found in keystore; using provided ANDROID_KEY_ALIAS'
            alias_from_keystore="$ANDROID_KEY_ALIAS"
          fi
          echo "Resolved keystore alias: $alias_from_keystore"
          echo "key_alias=$alias_from_keystore" >> "$GITHUB_OUTPUT"

      - name: Build unsigned release APK
        if: steps.keystore_check.outputs.present == 'true'
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle_release.log

      - name: Sign release APK with apksigner
        if: steps.keystore_check.outputs.present == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ steps.decode_keystore.outputs.key_alias }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          APK_SIGNER="$ANDROID_BUILD_TOOLS/apksigner"
          ZIP_ALIGN="$ANDROID_BUILD_TOOLS/zipalign"
          for tool in "$APK_SIGNER" "$ZIP_ALIGN"; do
            if [ ! -x "$tool" ]; then
              echo "Missing required build tool: $tool"
              ls -l "$ANDROID_BUILD_TOOLS" || true
              exit 1
            fi
          done
          UNSIGNED=$(ls app/build/outputs/apk/release/*-unsigned.apk 2>/dev/null | head -1)
          if [ -z "$UNSIGNED" ]; then
            echo "Unsigned APK not found."
            ls -R app/build/outputs/apk/release/
            exit 1
          fi
          ALIGNED=app/build/outputs/apk/release/app-release-aligned-unsigned.apk
          SIGNED=app/build/outputs/apk/release/app-release.apk
          "$ZIP_ALIGN" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$APK_SIGNER" sign --ks app/release.keystore --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "$SIGNED" "$ALIGNED"
          "$APK_SIGNER" verify -v "$SIGNED"

      - name: Build release AAB
        if: steps.keystore_check.outputs.present == 'true'
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew bundleRelease --no-daemon --stacktrace 2>&1 | tee gradle_bundle.log

      - name: Sign release AAB with jarsigner
        if: steps.keystore_check.outputs.present == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ steps.decode_keystore.outputs.key_alias }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          AAB=app/build/outputs/bundle/release/app-release.aab
          if [ ! -f "$AAB" ]; then
            echo "AAB not found at $AAB"
            ls -R app/build/outputs/bundle/release/
            exit 1
          fi
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore app/release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            "$AAB" "$ANDROID_KEY_ALIAS"
          jarsigner -verify -certs "$AAB" | head -n 20

      - name: Stage release artifacts
        if: steps.keystore_check.outputs.present == 'true'
        run: |
          set -e
          base="digifamar-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}"
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/${base}-release.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "artifacts/${base}-release.aab"
          keytool -printcert -jarfile "artifacts/${base}-release.apk" | grep -i 'SHA256' | tee fingerprint.txt
          ls -l artifacts

      - name: Upload release artifacts
        if: steps.keystore_check.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digifamar-release
          path: |
            artifacts/*-release.apk
            artifacts/*-release.aab
          if-no-files-found: error

      # ---------- Publish a downloadable GitHub Release ----------
      - name: Compose release notes
        id: notes
        run: |
          {
            echo "**Version:** ${{ steps.version.outputs.version_name }} (build ${{ steps.version.outputs.version_code }})"
            echo ""
            echo "**Commit:** \`${GITHUB_SHA}\`"
            echo ""
            if [ "${{ steps.keystore_check.outputs.present }}" = "true" ]; then
              echo "Signed release APK + AAB included, plus the debug APK for sideloading."
              echo ""
              echo "Signing certificate:"
              echo '```'
              cat fingerprint.txt 2>/dev/null || echo "fingerprint unavailable"
              echo '```'
            else
              echo "Debug APK only — add the \`ANDROID_KEYSTORE_BASE64\` repo secret to also get a signed release APK/AAB."
            fi
          } > release_notes.md
          cat release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: DiGiFaMaR ${{ steps.version.outputs.version_name }} (build ${{ steps.version.outputs.version_code }})
          body_path: release_notes.md
          draft: false
          prerelease: ${{ steps.keystore_check.outputs.present != 'true' }}
          files: |
            artifacts/*.apk
            artifacts/*.aab
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------- Diagnostics on failure ----------
      - name: Collect build logs on failure
        if: failure()
        run: |
          readTail() { echo "=== $1 ==="; tail -c 20000 "$1" 2>/dev/null || echo "($1 not found)"; echo; }
          {
            echo "SHA: $GITHUB_SHA"
            echo "RUN: $GITHUB_RUN_ID"
            readTail build_mobile.log
            readTail cap_sync.log
            readTail android/gradle_debug.log
            readTail android/gradle_release.log
            readTail android/gradle_bundle.log
            readTail android/keystore_info.txt
          } > "build-failure-${GITHUB_RUN_ID}.txt"
          tail -c 4000 "build-failure-${GITHUB_RUN_ID}.txt"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: build-failure-*.txt
          if-no-files-found: warn
