name: Build Android App (Test)

# Lightweight test build that produces a debug APK on every push (any branch)
# and on manual dispatch, without creating a GitHub Release. Use this for QA
# before merging to main.

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Override versionName (e.g. 1.2.0). Leave blank to use package.json."
        required: false
        default: ""
      version_code:
        description: "Override versionCode (integer). Leave blank for auto."
        required: false
        default: ""

concurrency:
  group: build-apk-test-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION_CODE_OFFSET: 100

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install

      # Writes an untracked .env consumed by vite.config.mobile.ts (loadEnv).
      # Never committed: .env is gitignored and no step commits anything.
      - name: Write mobile env file
        run: |
          cat > .env <<EOF
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID=${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_PAYMENTS_CLIENT_TOKEN=${{ secrets.VITE_PAYMENTS_CLIENT_TOKEN }}
          VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY=${{ secrets.VITE_MAPS_KEY }}
          EOF



      - name: Resolve app version
        id: version
        env:
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code }}
        run: |
          set -e
          pkg_version=$(node -p "require('./package.json').version || '1.0.0'")
          version_name="${INPUT_VERSION_NAME:-$pkg_version}"
          if [ -n "$INPUT_VERSION_CODE" ]; then
            version_code="$INPUT_VERSION_CODE"
          else
            version_code=$(( VERSION_CODE_OFFSET + GITHUB_RUN_NUMBER ))
          fi
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Apply version to Android build.gradle
        run: |
          set -e
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode ${{ steps.version.outputs.version_code }}/" android/app/build.gradle
          sed -i -E "s/versionName[[:space:]]+\"[^\"]*\"/versionName \"${{ steps.version.outputs.version_name }}\"/" android/app/build.gradle
          grep -nE 'versionCode|versionName' android/app/build.gradle

      # CI-only: source maps are generated here (never in the default
      # `bun run build:mobile`), uploaded to PostHog, then deleted before
      # `cap sync` so no .map file ever ships inside the APK.
      - name: Build mobile SPA
        run: |
          set -o pipefail
          bun run build:mobile --sourcemap 2>&1 | tee build_mobile.log

      - name: PostHog sourcemap inject
        continue-on-error: true
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_CLI_ENV_ID: "547025"
        run: npx --yes @posthog/cli@latest --host https://us.posthog.com sourcemap inject --directory dist/client/assets

      - name: PostHog sourcemap upload
        continue-on-error: true
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_CLI_ENV_ID: "547025"
        run: |
          npx --yes @posthog/cli@latest --host https://us.posthog.com sourcemap upload \
            --directory dist/client/assets \
            --delete-after \
            --release-name digifamar-android \
            --release-version "${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}"

      # Safety net: if either PostHog step failed, maps may still be on disk.
      - name: Strip source maps before packaging
        if: always()
        run: |
          find dist/client -name '*.map' -type f -print -delete || true

      - name: Sync Capacitor (Android)
        run: |
          set -o pipefail
          npx cap sync android 2>&1 | tee cap_sync.log


      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          cmdline-tools-version: latest
          packages: ""

      - name: Cache Android SDK packages
        id: android-sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/platforms
            ${{ env.ANDROID_SDK_ROOT }}/build-tools
            ${{ env.ANDROID_SDK_ROOT }}/platform-tools
            ${{ env.ANDROID_SDK_ROOT }}/licenses
          key: android-sdk-${{ runner.os }}-platform36-buildtools36.0.0
          restore-keys: android-sdk-${{ runner.os }}-

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install required Android SDK packages
        run: |
          set -e
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_BUILD_TOOLS=$ANDROID_SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
            android/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/**/gradle-wrapper.properties', 'android/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle') }}
            gradle-${{ runner.os }}-

      - name: Build debug APK
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dkotlin.incremental=false
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --build-cache --stacktrace 2>&1 | tee gradle_debug.log

      - name: Stage debug APK
        run: |
          set -e
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/digifamar-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}-debug.apk"
          ls -l artifacts

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: digifamar-debug-apk-test
          path: artifacts/*-debug.apk
          if-no-files-found: error

      - name: Collect build logs on failure
        if: failure()
        run: |
          readTail() { echo "=== $1 ==="; tail -c 20000 "$1" 2>/dev/null || echo "($1 not found)"; echo; }
          {
            echo "SHA: $GITHUB_SHA"
            echo "RUN: $GITHUB_RUN_ID"
            readTail build_mobile.log
            readTail cap_sync.log
            readTail android/gradle_debug.log
          } > "build-failure-test-${GITHUB_RUN_ID}.txt"
          tail -c 4000 "build-failure-test-${GITHUB_RUN_ID}.txt"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs-test
          path: build-failure-*.txt
          if-no-files-found: warn
